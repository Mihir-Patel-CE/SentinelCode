services:
  - type: web
    name: sentinelcode-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://sentinel-code.vercel.app,https://sentinelcode-1.onrender.com,https://sentinelcode.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: AI_PROVIDER
        value: mock
